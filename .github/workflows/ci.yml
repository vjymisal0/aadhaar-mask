name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
      - name: Test
        run: npm test
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Build
        run: npm run build --if-present
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Validate packed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/package-artifact" "$RUNNER_TEMP/package-consumer"
          npm pack --pack-destination "$RUNNER_TEMP/package-artifact"
          cd "$RUNNER_TEMP/package-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/package-artifact"/*.tgz
